<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-fit=cover">
    <title>Em Construção</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #499375;
            --bg-dark: #00261b;      
            --zeleno-dark: #00543d; 
            --glass: rgba(255, 255, 255, 0.05);
        }

        /* --- Estilos Base (Sincronizados com medicos.html) --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            color: #fff; 
            font-family: 'Poppins', sans-serif; 
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- Header Padronizado --- */
        .main-header {
            position: fixed; top: 0; left: 0; width: 100%;
            display: flex; align-items: center; justify-content: center; 
            padding: 20px 4%; z-index: 10000;
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(73, 147, 117, 0.1);
            height: 100px;
        }
        .header-logo img { height: 48px; width: auto; }

        /* --- Conteúdo "Em Construção" --- */
        .construction-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 150px 5% 80px;
            text-align: center;
        }

        .editorial-tag { 
            font-size: 10px; 
            text-transform: uppercase; 
            letter-spacing: 4px; 
            color: var(--primary); 
            margin-bottom: 20px; 
            display: block; 
        }

        .title-ultra { 
            font-size: clamp(2rem, 8vw, 4rem); 
            font-weight: 900; 
            line-height: 1; 
            text-transform: uppercase; 
            margin-bottom: 20px;
        }
        .title-ultra span { font-weight: 200; display: block; color: #fff; }

        .status-box {
            background: var(--glass);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(73, 147, 117, 0.2);
            max-width: 600px;
            width: 100%;
            margin-top: 30px;
        }

        .loader-icon {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1); }
            100% { opacity: 1; transform: scale(1); }
        }

        .btn-back {
            background: var(--primary);
            color: #ffffff;
            padding: 15px 35px;
            border-radius: 4px;
            font-weight: 900;
            text-decoration: none;
            display: inline-block;
            font-size: 12px;
            text-transform: uppercase;
            margin-top: 30px;
            transition: 0.3s;
        }
        .btn-back:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(73, 147, 117, 0.2); }

        .main-footer { 
            background: #001a13; 
            padding: 30px; 
            border-top: 1px solid rgba(73, 147, 117, 0.1); 
            text-align: center;
        }
        .whatsapp-float { position: fixed; bottom: 30px; right: 30px; z-index: 9999; background: #25d366; color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-decoration: none; transition: 0.3s; animation: pulse-whatsapp 2s infinite; }
        .whatsapp-float:hover { transform: scale(1.1); background: #20ba5a; }
        @keyframes pulse-whatsapp { 0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); } 100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); } }
    
        /* --- MENU FLUTUANTE ---
           Barra destacada das rgba(73, 147, 117, 0.20)s, com cantos arredondados, que acompanha
           o usuario em toda a navegacao e nao se esconde mais ao rolar.
           IMPORTANTE: sem transform e sem backdrop-filter aqui. Os dois criam
           containing block e prendem o painel do menu mobile (position: fixed)
           dentro da area da barra. */
        .main-header {
            position: fixed;
            height: auto;
            padding: 9px 20px;
            top: 14px;
            left: 3%;
            right: 3%;
            width: auto;
            border-radius: 18px;
            border: 1px solid rgba(73, 147, 117, 0.20);
            background: rgba(0, 30, 22, 0.94);
            box-shadow: 0 12px 34px rgba(0, 0, 0, 0.45);
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }

        /* O menu acompanha o usuario: a regra de esconder no scroll fica sem efeito. */
        .main-header.header-hidden {
            transform: none;
            opacity: 1;
            pointer-events: auto;
        }

        @media (max-width: 1023px) {
            .main-header {
                top: 10px;
                left: 3%;
                right: 3%;
                border-radius: 14px;
                padding: 7px 14px;
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
            }
        }
        /* --- PADRAO DE CORES DO MENU ---
           Barra escura -> textos e logo sempre brancos. */
        .main-header .nav-link:not(.active-box):not(.btn-store-header):not(.btn-green-box),
        .main-header .mobile-menu-toggle { color: #ffffff; }
        .main-header .header-logo img { filter: brightness(0) invert(1); }

        /* Botoes do menu: verde escuro com texto branco em todos os modos.
           Contorno leve para nao se confundir com a barra escura. */
        .main-header .nav-link.active-box,
        .main-header .btn-store-header,
        .main-header .btn-green-box {
            background: #00543d !important;
            color: #ffffff !important;
        }
        .main-header .nav-link.active-box,
        .main-header .btn-store-header,
        .main-header .btn-green-box { border: 1px solid rgba(255,255,255,0.18); }
        /* --- SEM PALAVRA SOZINHA NA LINHA ---
           Nenhum texto do site pode quebrar deixando uma palavra orfa na
           ultima linha. balance reparte as linhas em comprimentos parecidos
           (bom para titulo curto); pretty evita a viuva no fim do paragrafo.
           Navegador sem suporte ignora e quebra do jeito tradicional. */
        h1, h2, h3, h4, h5, h6,
        .giant-title, .title-chic, .section-title, .product-title,
        .footer-title, .editorial-tag, .floating-tag, .step-card h3,
        .diff-item h4, .science-box h4, .value-card h3, .card-content h3,
        .property-card h3, .review-text, .big-quote h2, .cta-block h2,
        .booking-copy h1, .booking-intro h1, .contact-info h1,
        .policy-section h1, .policy-section h2, .faq-question,
        .btn-more, .btn-read, .btn-main, .detail-list b, .stat-label {
            text-wrap: balance;
        }

        p, li, figcaption, blockquote, .info-text, .product-description,
        .section-lead, .section-head p, .text-reveal p, .photo-credit,
        .article-meta, .author-box p, .consult-note, .review-author,
        .booking-cta-note, .mini-review p, .footer-brand p, .footer-bottom p {
            text-wrap: pretty;
        }
        /* --- LARGURA DA BARRA DO MENU ---
           No desktop a barra passa a ter a largura do proprio conteudo:
           comeca na borda do botao "Agendar Consulta" e termina na do
           "Loja Exclusiva". Centralizada com margin auto, nunca com
           translateX, que criaria containing block e prenderia o painel
           do menu mobile. No celular ela continua ocupando a largura toda. */
        @media (min-width: 1024px) {
            .main-header {
                left: 0;
                right: 0;
                width: fit-content;
                max-width: 94%;
                margin-left: auto;
                margin-right: auto;
            }
            .main-header .nav-group {
                flex: 0 0 auto;
                width: auto;
                max-width: none;
            }
        }</style>
</head>
<body>
    <a href="https://hubs.ly/Q04sNmtw0" class="whatsapp-float" target="_blank">
        <i class="fab fa-whatsapp"></i>
    </a>


    <header class="main-header">
        <div class="header-logo">
            <a href="/">
                <img src="/logo.png" alt="Zeleno">
            </a>
        </div>
    </header>

    <main class="construction-container">
        <span class="editorial-tag">Área Restrita</span>
        <h1 class="title-ultra"><span></span><b>Em Desenvolvimento</b></h1>
        
        <div class="status-box">
            <div class="loader-icon">
                <i class="fas fa-microscope"></i>
            </div>
            <p style="opacity: 0.8; line-height: 1.8; font-size: 1.1rem;">
                Estamos preparando um ambiente exclusivo .
            </p>
            <p style="margin-top: 15px; font-size: 0.9rem; color: var(--primary); font-weight: 700;">
                PREVISÃO DE LANÇAMENTO: junho 2026
            </p>
        </div>

        <a href="/para-medicos" class="btn-back">Voltar para Início</a>
    </main>

    <footer class="main-footer">
        <p style="font-size: 11px; color: rgba(255,255,255,0.5);">&copy; 2026 Zeleno Meds. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
